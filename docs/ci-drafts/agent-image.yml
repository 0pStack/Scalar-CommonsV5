# DRAFT — not enabled. A human copies this to .github/workflows/agent-image.yml
# (the lab agent may not touch .github/). Publishes the reference agent image:
#   ghcr.io/tejaspatil1936/scalar-agent:<version>   (and :latest)
#
# Trigger: push a tag `agent-v0.1.0` → image tag `0.1.0`.
# Needs no secrets beyond the built-in GITHUB_TOKEN; the package inherits the
# repository's visibility until it is made public under Package settings.
name: agent-image

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish, e.g. 0.1.0'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tejaspatil1936/scalar-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          # Untrusted free text on workflow_dispatch: only ever read as an env var.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#agent-v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "version must be strict semver (e.g. 0.1.0), got a different value" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The gate the image is built from: the same one the PR ran.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd agent && npm ci && npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root: the agent builds against ../sdk until the SDK is on npm.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
