# Pinned toolchain for Scalar Commons.
#
# This pin is load-bearing, not hygiene: it must move together with the
# Polkadot SDK tag in Cargo.toml. A floating toolchain against a fixed SDK tag
# breaks on its own as stable advances (rustc 1.97.1 could not build
# polkadot-stable2503, whose `sp-io` put `#[no_mangle]` on the panic handler).
#
# 1.93.0 is the toolchain polkadot-stable2606 is built and tested with
# (`.github/env` at that tag: ci-unified:bullseye-1.93.0). Do not bump this
# without also moving the SDK tag.
#
# `wasm32v1-none` is the correct WASM target here, not `wasm32-unknown-unknown`:
# substrate-wasm-builder selects it whenever rustc >= 1.84 and the target is
# installed (see `rustc_target()` in substrate/utils/wasm-builder/src/lib.rs).
# Without it the builder silently falls back to `wasm32-unknown-unknown` plus
# `-Z build-std`, which is slower and needs `rust-src` anyway.

[toolchain]
channel = "1.93.0"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["wasm32v1-none"]
profile = "minimal"
