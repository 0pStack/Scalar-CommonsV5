[package]
name    = "pallet-constitution"
version = "4.0.0"
publish = false
edition = "2021"

[dependencies]
parity-scale-codec  = { version = "3.6.12", default-features = false, features = ["derive"] }
scale-info          = { version = "2.11",   default-features = false, features = ["derive"] }
frame-support       = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-3", default-features = false }
frame-system        = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-3", default-features = false }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
]
runtime-benchmarks = ["frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks"]
try-runtime        = ["frame-support/try-runtime", "frame-system/try-runtime"]
