[package]
name = "pallet-escrow"
version = "4.0.0"
edition = "2021"

[dependencies]
parity-scale-codec = { version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
pallet-agents = { path = "../agents", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false, optional = true }

# Crates the test mock in src/tests.rs needs but the pallet itself does not.
# std is on here (no `default-features = false`) because test runtimes execute
# natively. frame-support, frame-system, sp-runtime and pallet-agents are already
# above and reach the mock with std via this crate's default `std` feature.
[dev-dependencies]
# sp_core::H256 — frame_system::Config::Hash in the mock (tests.rs:7).
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
# sp_io::TestExternalities — new_test_ext() return type.
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
# pallet_balances — the mock's Currency and AccountData.
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }

[features]
default = ["std"]
std = ["pallet-agents/std","parity-scale-codec/std","scale-info/std","frame-support/std","frame-system/std","sp-runtime/std","sp-std/std","frame-benchmarking?/std"]
runtime-benchmarks = ["frame-support/runtime-benchmarks","frame-system/runtime-benchmarks","frame-benchmarking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime","frame-system/try-runtime"]
