# deploy/hardening/sshd.conf
#
# Installed to /etc/ssh/sshd_config.d/10-scalar-hardening.conf by
# deploy/hardening/apply.sh. Do not edit the installed copy — edit this
# one and re-run the script, so the repository stays the source of truth.
#
# WHY THIS FILE EXISTS
#
# /etc/ssh/sshd_config on the devnet host ends with two appended lines:
#
#     PasswordAuthentication yes
#     PermitRootLogin yes
#
# sshd listens on 0.0.0.0:22 and [::]:22, so the box accepts password-based
# ROOT login from the internet. The only brute-force control in front of it is
# fail2ban, which until now was documented nowhere in this repository — a
# clean-machine rebuild following deploy/ reproduced neither the ban jail nor
# the firewall, and an operator had no way to know either existed. See
# TESTNETAUDIT.md §6 I-24 and issue #138.
#
# This sits directly beneath the sudo key: anyone who gets a shell on this box
# gets the operator's root key for the chain, the faucet's signing key, and
# every validator's session keys, without touching the chain at all. Rotating
# the sudo key off //Alice (#119) bought nothing if the host itself is a
# password guess away.
#
# WHY A DROP-IN AND NOT AN EDIT TO sshd_config
#
# Because the two bad lines are at the END of sshd_config and sshd takes the
# FIRST value it obtains for a keyword, not the last. sshd_config carries
# `Include /etc/ssh/sshd_config.d/*.conf` at line 12 — before them — so a
# drop-in wins without anyone having to hand-edit a file that some other tool
# may rewrite. apply.sh verifies that the Include is present and that the
# values actually took effect, rather than assuming either.
#
# The 10- prefix matters: drop-ins are read in lexical order and first value
# wins, so a low number cannot be overridden by a drop-in added later.

# No passwords, over any transport. Key-based authentication only.
PasswordAuthentication no

# Also close the PAM keyboard-interactive path, which is a second way to reach
# a password prompt and is NOT covered by PasswordAuthentication no while
# UsePAM is yes.
KbdInteractiveAuthentication no

# No root logins at all — not by password, not by key. Administration goes
# through an unprivileged account and sudo, so the audit trail names a person.
PermitRootLogin no
