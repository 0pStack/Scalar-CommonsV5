# Swarm engine: an agent picks up any issue labeled `agent-task`
# or any @claude mention in issues/PRs, works it, and opens a PR.
# Requires: Claude GitHub App installed on the repo + ANTHROPIC_API_KEY secret.
# NOTE: verify inputs against the current anthropics/claude-code-action README on install.
name: claude-swarm
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent-task')) ||
      contains(github.event.comment.body || '', '@claude') ||
      contains(github.event.review.body || '', '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@v2
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 60"
