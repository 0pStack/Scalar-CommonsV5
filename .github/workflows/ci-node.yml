# ci-node — the gate for the JS/TS subprojects.
#
# WHY THIS EXISTS: until this workflow, `.github/workflows/ci-fast.yml` and
# `ci-full.yml` contained zero npm/node steps. landing/, faucet/, docs/ and sdk/
# all ship real test suites that no automated gate ever executed. The visible
# consequence: PRs #91, #92 and #93 are entirely TypeScript and all three report
# "2 checks passed" — those two checks are the Rust workspace gates, which did
# not compile or run a single line of the code those PRs add. A check that never
# looks at the change is not a check.
#
# ONE JOB PER SUBPROJECT, on purpose. A single job running them all would let
# one project's red hide another's, and would make the branch-protection
# contexts useless for telling you *what* broke. One job, one stable name each.
#
# ONE INSTALL PER JOB, AT THE ROOT. The JS/TS packages are one npm workspace
# with one package-lock.json, so every job runs `npm ci` at the repository root
# and then that package's scripts with `npm run <script> -w <package>`. Do not
# `npm ci` inside a package directory: npm resolves the workspace root and
# prunes node_modules down to that one package's dependencies.
#
# NOTHING HERE REQUIRES A LIVE CHAIN. Every command below runs against committed
# fixtures or mocks. The suites that genuinely need the devnet are NOT deleted
# and NOT skipped — they live in e2e/ (pallet lifecycles, the faucet, indexer
# and explorer live suites, the attacker-archetype runner), which this workflow
# typechecks but never runs. How to run them is in e2e/README.md.
name: ci-node

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Repository-wide JavaScript and TypeScript quality gates. These always run:
  # root tooling, shared configuration, or a workflow can affect every package.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        run: npm ci
      - name: Audit development tooling
        run: npm audit --audit-level=low
      - name: Tooling policy tests
        run: npm run test:tooling
      - name: Check formatting
        run: npm run format:check
      - name: Lint JavaScript and TypeScript
        run: npm run lint
      - name: Enforce offline coverage
        run: npm run coverage

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Lint shell scripts
        run: find . -type f -name '*.sh' -not -path './target/*' -not -path './node_modules/*' -print0 | xargs -0 shellcheck --severity=warning

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

  # ── Which subprojects does this change actually touch? ──────────────────────
  #
  # The obvious implementation — a workflow-level `paths:` filter — is a trap
  # when the resulting checks are REQUIRED by branch protection. If `paths:`
  # excludes a PR the workflow never runs, the required context never reports,
  # and the PR sits "Expected — waiting for status" forever with no way to
  # clear it.
  #
  # So: the jobs below ALWAYS run and ALWAYS report. This job computes what
  # changed, and each job's real work is gated on that. A PR touching only Rust
  # gets green checks in a few seconds each, having correctly done nothing.
  #
  # Implemented with plain `git diff` rather than a third-party paths-filter
  # action: it is auditable in place and adds no supply-chain surface to a
  # workflow that gates the trunk.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      faucet: ${{ steps.filter.outputs.faucet }}
      docs: ${{ steps.filter.outputs.docs }}
      sdk: ${{ steps.filter.outputs.sdk }}
      agent: ${{ steps.filter.outputs.agent }}
      indexer: ${{ steps.filter.outputs.indexer }}
      explorer: ${{ steps.filter.outputs.explorer }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base against the PR's target actually exists.
          fetch-depth: 0

      - name: Determine changed subprojects
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD")"
            echo "── files changed vs origin/$BASE_REF ──"
            printf '%s\n' "$CHANGED"
          elif [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # A push is scoped to what it changed since the previous tip of main.
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            echo "── files changed in this push ──"
            printf '%s\n' "$CHANGED"
          else
            # Manual dispatch, a new branch, or a force-push whose old tip is
            # gone: there is no reliable diff, so run everything.
            CHANGED=""
            echo "event=$EVENT — running every subproject job"
          fi

          # A change to this workflow re-runs everything: the gate itself is the
          # thing under test, and scoping it to nothing would let a broken gate
          # merge green. So does a change to the workspace root: every job
          # installs from the one root lockfile and every TS package extends
          # tsconfig.base.json, so a change there can break any package without
          # touching a file under it.
          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qE '^(\.github/workflows/ci-node\.yml|package\.json|package-lock\.json|\.nvmrc|tsconfig\.base\.json)$'; then
            for p in landing faucet docs sdk agent indexer explorer e2e; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
            echo "→ all subprojects selected"
            exit 0
          fi

          selected() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }

          # landing's suite is NOT self-contained: landing/test/claims.test.mjs
          # asserts that every marketing claim still quotes a snippet that is
          # literally present in the Rust source (landing/src/source-claims.mjs
          # cites pallets/emissions, pallets/orchestrator and runtime), and it
          # asserts the oracle caveat stays on the page for as long as
          # `type OracleScoreProvider = ();` is still in runtime/src/lib.rs.
          # Editing those Rust files can therefore turn the landing gate red, so
          # they belong in its filter. Without this, a runtime change would break
          # landing on main with no PR having ever run the check.
          if selected '^landing/' \
            || selected '^runtime/src/lib\.rs$' \
            || selected '^pallets/emissions/src/lib\.rs$' \
            || selected '^pallets/orchestrator/src/lib\.rs$'; then
            echo "landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing=false" >> "$GITHUB_OUTPUT"
          fi

          for p in faucet docs sdk indexer explorer; do
            if selected "^$p/"; then echo "$p=true" >> "$GITHUB_OUTPUT"; else echo "$p=false" >> "$GITHUB_OUTPUT"; fi
          done

          # agent/ imports the workspace sdk/ (its built dist/), so an SDK
          # change can break it; both paths select it.
          if selected '^agent/' || selected '^sdk/'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

          # e2e/ typechecks the faucet, indexer and explorer sources its live
          # suites import (by relative path) and imports the workspace sdk/ (its
          # built dist/), so a change to any of them can break it.
          if selected '^e2e/' || selected '^(faucet|indexer|explorer)/src/' || selected '^sdk/'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

          echo "── selection ──"; cat "$GITHUB_OUTPUT"

  # ── landing ────────────────────────────────────────────────────────────────
  # Gate: npm ci && npm run build && npm test — exactly the scripts landing's
  # package.json defines ("build": node scripts/build.mjs, "test": node --test).
  #
  # EXCLUDED, both because they need a live node and because neither is a
  # test/lint/build script: `verify:chain` and `fetch:chain-facts`. The build
  # reads the COMMITTED landing/chain-facts.json, so it is fully offline.
  landing:
    name: landing
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.landing == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.landing == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.landing == 'true'
        run: npm ci
      - name: npm run build
        if: needs.changes.outputs.landing == 'true'
        run: npm run build -w landing
      - name: npm test
        if: needs.changes.outputs.landing == 'true'
        run: npm test -w landing
      - name: Not selected
        if: needs.changes.outputs.landing != 'true'
        run: echo "landing/ unchanged — nothing to check."

  # ── faucet ─────────────────────────────────────────────────────────────────
  # Gate: npm ci && npm run typecheck && npm test. Every file in faucet/tests is
  # offline.
  #
  # The live suite (25 tests: real drips from a genesis-endowed account, balance
  # asserted on chain, deliberately NOT skippable because "an unreachable node is
  # a blocking finding") moved to e2e/faucet/ and runs with
  # `npm run test:live:faucet -w e2e` against a devnet. Measured 2026-08-19
  # against the live 5-validator devnet, before the move: 55/55 pass.
  faucet:
    name: faucet
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.faucet == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.faucet == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.faucet == 'true'
        run: npm ci
      - name: npm run typecheck
        if: needs.changes.outputs.faucet == 'true'
        run: npm run typecheck -w faucet
      - name: npm test
        if: needs.changes.outputs.faucet == 'true'
        run: npm test -w faucet
      - name: Not selected
        if: needs.changes.outputs.faucet != 'true'
        run: echo "faucet/ unchanged — nothing to check."

  # ── indexer ────────────────────────────────────────────────────────────────
  # Gate: npm ci && npm run typecheck && npm test. Every file in indexer/tests
  # is offline (in-memory SQLite, constructed inputs).
  #
  # The live suite (real extrinsics, indexed from finalized blocks and
  # cross-checked against direct RPC reads on all 25 v1 endpoints; it fails, not
  # skips, when no node answers) moved to e2e/indexer/:
  # `npm run test:live:indexer -w e2e`.
  # node 22 is required: the store uses node:sqlite (package.json engines).
  indexer:
    name: indexer
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.indexer == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.indexer == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.indexer == 'true'
        run: npm ci
      - name: npm run typecheck
        if: needs.changes.outputs.indexer == 'true'
        run: npm run typecheck -w indexer
      - name: npm test
        if: needs.changes.outputs.indexer == 'true'
        run: npm test -w indexer
      - name: Not selected
        if: needs.changes.outputs.indexer != 'true'
        run: echo "indexer/ unchanged — nothing to check."

  # ── explorer ───────────────────────────────────────────────────────────────
  # Gate: npm ci && npm run typecheck && npm test. typecheck also covers the
  # test files (tsconfig.test.json). Every file in explorer/tests is offline.
  #
  # The live suite (pages rendered from a devnet RPC and one real transfer
  # signed; it fails, not skips, when the node is unreachable) moved to
  # e2e/explorer/: `npm run test:live:explorer -w e2e`.
  explorer:
    name: explorer
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.explorer == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.explorer == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.explorer == 'true'
        run: npm ci
      - name: npm run typecheck
        if: needs.changes.outputs.explorer == 'true'
        run: npm run typecheck -w explorer
      - name: npm test
        if: needs.changes.outputs.explorer == 'true'
        run: npm test -w explorer
      - name: Not selected
        if: needs.changes.outputs.explorer != 'true'
        run: echo "explorer/ unchanged — nothing to check."

  # ── docs ───────────────────────────────────────────────────────────────────
  # Gate: npm ci && npm run lint && npm run build. docs/ defines no `test`
  # script; `lint` is its real check — markdownlint plus check-chain-values.mjs,
  # which cross-checks every documented constant, pallet index, invariant and
  # extrinsic against docs/.chain/snapshot.json.
  #
  # EXCLUDED: `snapshot:chain`, the only docs script that opens a WS connection.
  # It REGENERATES the snapshot from a live node, so running it in CI would
  # overwrite the very fixture the lint asserts against — a gate that rewrites
  # its own expected values checks nothing. Refreshing the snapshot stays a
  # deliberate, reviewable commit.
  docs:
    name: docs
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.docs == 'true'
        run: npm ci
      - name: npm run lint
        if: needs.changes.outputs.docs == 'true'
        run: npm run lint -w docs
      - name: npm run build
        if: needs.changes.outputs.docs == 'true'
        run: npm run build -w docs
      - name: Not selected
        if: needs.changes.outputs.docs != 'true'
        run: echo "docs/ unchanged — nothing to check."

  # ── sdk ────────────────────────────────────────────────────────────────────
  # Gate: npm ci && npm run typecheck && npm test.
  #
  # NO live-test exclusion is needed here and none is applied. sdk's chain-
  # dependent block already gates itself — tests/integration.test.ts:237 is
  # `describe.skipIf(!runReal)` behind RUN_INTEGRATION=1 — so a plain `npm test`
  # is offline by construction (9 passed, 1 skipped).
  #
  # THIS JOB WAS RED ON THE UPSTREAM master WHEN ADDED, and that was the point.
  # Two real defects, both measured 2026-08-19 and reported in docs/history/CI-NODE.md:
  #
  #   1. `npm ci` FAILED — sdk/ had no package-lock.json at all, so the
  #      gate could not even install. (npm error code EUSAGE.)
  #   2. `npm run typecheck` FAILED with 47 errors in src/index.ts (TS2532/TS2722
  #      under noUncheckedIndexedAccess).
  #
  # Neither is fixed or worked around in this round, per the standing rule: a
  # failure is a finding, not something to route around. No `continue-on-error`,
  # no `|| true`, no narrowed command. PR #91 already fixes both (it adds the
  # lockfile and its txEntry/queryEntry/constEntry guards clear all 47 errors —
  # verified against origin/task/72, which typechecks clean).
  #
  # This job once ran without `cache: npm`, because sdk/ had no lockfile and the
  # cache setup would have buried the EUSAGE error. The root package-lock.json
  # now covers sdk/, so it caches like every other job.
  sdk:
    name: sdk
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.sdk == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.sdk == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.sdk == 'true'
        run: npm ci
      - name: npm run typecheck
        if: needs.changes.outputs.sdk == 'true'
        run: npm run typecheck -w sdk
      - name: npm test
        if: needs.changes.outputs.sdk == 'true'
        run: npm test -w sdk
      - name: Not selected
        if: needs.changes.outputs.sdk != 'true'
        run: echo "sdk/ unchanged — nothing to check."

  # ── agent ─────────────────────────────────────────────────────────────────
  # Gate: npm ci at the root, build sdk/ (the agent imports the workspace SDK's
  # dist/; one hoisted @polkadot copy, so nothing is vendored), then typecheck
  # and test agent/. Offline: the suite drives the agent loop against a fake
  # chain and runs the messaging worked example with dev keys; no node needed.
  agent:
    name: agent
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.agent == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.agent == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.agent == 'true'
        run: npm ci
      - name: build sdk
        if: needs.changes.outputs.agent == 'true'
        run: npm run build -w sdk
      - name: npm run typecheck
        if: needs.changes.outputs.agent == 'true'
        run: npm run typecheck -w agent
      - name: npm test
        if: needs.changes.outputs.agent == 'true'
        run: npm test -w agent
      - name: Not selected
        if: needs.changes.outputs.agent != 'true'
        run: echo "agent/ and sdk/ unchanged — nothing to check."

  # ── e2e ───────────────────────────────────────────────────────────────────
  # Gate: npm ci, build sdk/ (e2e imports the workspace SDK's dist/), then
  # npm run typecheck -w e2e. Typecheck ONLY: every suite in
  # e2e/ needs a live chain, so none of them runs here. The typecheck keeps the
  # live suites compiling against the faucet, indexer and explorer sources they
  # import, so a refactor there cannot silently break them between devnet runs.
  e2e:
    name: e2e
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.e2e == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.e2e == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        if: needs.changes.outputs.e2e == 'true'
        run: npm ci
      - name: build sdk
        if: needs.changes.outputs.e2e == 'true'
        run: npm run build -w sdk
      - name: npm run typecheck
        if: needs.changes.outputs.e2e == 'true'
        run: npm run typecheck -w e2e
      - name: Not selected
        if: needs.changes.outputs.e2e != 'true'
        run: echo "e2e/, sdk/ and the app sources e2e imports unchanged — nothing to check."
