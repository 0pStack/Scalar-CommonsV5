# Pull-request gate.
#
#   secrets    every PR, seconds: gitleaks over full history
#   chainspec  every PR, seconds: published chain spec matches the operator spec
#   rust       only when the PR touches Rust: fmt, clippy, workspace tests
#   deps       when the PR touches Rust dependencies or their policy, and nightly:
#              cargo deny (deny.toml) and cargo audit (.cargo/audit.toml)
#
# The nightly run is deps only: advisories are published without any change
# here, and the other jobs would spend Actions minutes re-proving the same tree.
#
# The Rust release build is not repeated here; ci-full runs it once the change
# reaches main. JS packages are gated by ci-node.
name: ci-fast

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan. Runs as its own job so a leaked credential fails within
  # seconds instead of behind a 45-minute Rust build, and so that a red
  # secret scan is legible on the PR as its own check.
  #
  # fetch-depth: 0 is load-bearing -- the scan is `--log-opts="--all"`, so it
  # reads every commit on every ref. With the default shallow checkout it
  # would scan one commit and pass vacuously, which is the worst kind of
  # green. The gitleaks version is pinned: .gitleaks.toml relies on the
  # documented merge behaviour of a stub [[rules]] block, and an unpinned
  # upgrade could silently change whether the SS58 allowlist binds at all.
  #
  # The negative control is not decoration. It writes a fake private key to a
  # scratch file and asserts the scan goes red, which proves the config still
  # detects secrets rather than having been quietly neutered into a rubber
  # stamp. The scratch file is removed before the real scan runs.
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Control -- prove the allowlist is narrow, not a rubber stamp
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT

          # (1) generic-api-key must STILL fire on a non-SS58 secret. If this
          #     stops failing, .gitleaks.toml has neutered the rule we amended
          #     and the whole gate is decorative.
          # Assembled from halves on purpose. A complete high-entropy token
          # written literally here would be a real finding in this very file,
          # and the full-history scan below would (correctly) go red on it.
          # Neither half matches the rule on its own; the assembled file does.
          p1='Zt7Qp2Lm9Xc4Vb8N'
          p2='r3Wd6Ys1Hj5Kf0Ga'
          printf 'api_key = "%s%s"\n' "$p1" "$p2" > "$scratch/planted.txt"
          if gitleaks dir "$scratch/planted.txt" --config .gitleaks.toml \
               --no-banner --redact >/dev/null 2>&1; then
            echo "::error::gitleaks did NOT flag a planted generic-api-key secret -- the allowlist is too broad"
            exit 1
          fi

          # (2) an SS58 public address must be allowlisted. If this starts
          #     failing, the carve-out has stopped working and the real scan
          #     below is about to go red on public on-chain data.
          printf 'sudoKey: "5DFASjqmCBrMfRsHDzQyXGodfWL4Bj1uK6X2U3jBEEoPh8ZN"\n' > "$scratch/ss58.txt"
          if ! gitleaks dir "$scratch/ss58.txt" --config .gitleaks.toml \
                 --no-banner --redact >/dev/null 2>&1; then
            echo "::error::SS58 public address was flagged -- the allowlist regex no longer matches"
            exit 1
          fi

          echo "control OK: real secrets still caught, SS58 addresses exempt"

      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="--all" --redact --no-banner

  # The chain spec testers actually download. Runs unconditionally and without
  # network access: it compares docs/public/chainspec.json against the operator
  # spec in deploy/, so it cannot flake on a validator reboot, and it cannot be
  # skipped by a path filter that happens not to list deploy/.
  #
  # Why it is a gate and not a note: this file is the only way an outsider
  # learns the bootnode peer ids, and a stale genesis here means a tester syncs
  # a different chain and gets no error pointing at the cause.
  chainspec:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Published chain spec matches the operator spec
        run: node scripts/check-published-chainspec.mjs

  # rust: same path list as ci-full's push filter. deps: the manifests, the
  # lockfile and the two policy files. A manual dispatch runs everything; the
  # nightly schedule runs deps only.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if grep -qE '^(Cargo\.lock|(.*/)?Cargo\.toml|deny\.toml|\.cargo/audit\.toml|\.github/workflows/ci-fast\.yml)$' <<<"$changed"; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(Cargo\.(toml|lock)|rust-toolchain\.toml|rustfmt\.toml|(node|runtime|pallets|tests)/|\.github/workflows/ci-(fast|full)\.yml|\.github/actions/setup-rust/)' <<<"$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # See ci-full.yml: debuginfo is never read and would fill the runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rust-src, rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Dependency policy. cargo deny checks what the workspace builds: RustSec
  # advisories, licences, wildcard versions and git sources (deny.toml).
  # cargo audit reads the whole Cargo.lock, so it also catches crates that are
  # locked but never built (.cargo/audit.toml). Every advisory ignored in
  # deny.toml must also be ignored in audit.toml, so the two cannot drift.
  #
  # No setup-rust here: its cache is the multi-GB build cache, and a scheduled
  # run on main could save a near-empty one over it. cargo deny only needs
  # `cargo metadata`, which fetches the git-pinned Polkadot SDK by itself.
  # Both tools are pinned release binaries, checked by SHA-256.
  deps:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny and cargo-audit (pinned, checksummed)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          deny="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${deny}.tar.gz" | sha256sum -c -
          tar -xzf "${deny}.tar.gz"
          audit="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -sSfLO "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/${audit}.tgz"
          echo "${CARGO_AUDIT_SHA256}  ${audit}.tgz" | sha256sum -c -
          tar -xzf "${audit}.tgz"
          sudo install -m 0755 "${deny}/cargo-deny" "${audit}/cargo-audit" /usr/local/bin/
          cargo-deny --version
          cargo-audit --version

      - name: Every advisory ignored in deny.toml is ignored in .cargo/audit.toml
        run: |
          set -euo pipefail
          ids() { grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' "$1" | sort -u; }
          missing="$(comm -23 <(ids deny.toml) <(ids .cargo/audit.toml))"
          if [ -n "$missing" ]; then
            echo "::error::ignored in deny.toml but not in .cargo/audit.toml: $missing"
            exit 1
          fi

      - name: cargo deny
        run: cargo deny --locked check

      - name: cargo audit
        run: cargo audit
